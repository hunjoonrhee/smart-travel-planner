<div class="container">
  <div class="groupTitle">
    <mat-icon>{{ titleIcon() ? titleIcon() : 'help' }}</mat-icon>
    <h4>{{ title() }}</h4>
  </div>
  <ng-content />

  @if (addLabel() && addBtnIcon()) {
    <div class="add-options-button">
      <button matButton (click)="onAdd.emit()" type="button">
        <mat-icon>{{ addBtnIcon() ? addBtnIcon() : 'add' }}</mat-icon>
        {{ addLabel() ?? 'Hinzufügen' }}
      </button>
    </div>
  }
</div>
